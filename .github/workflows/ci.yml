name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        include:
          - php: '8.3'
            composer-flags: '--prefer-lowest'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl
          tools: composer
      - run: composer update --prefer-dist --no-interaction ${{ matrix.composer-flags }}
      - run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite offline
      - name: Live Sandbox catalog tests
        run: vendor/bin/phpunit -c phpunit.xml.dist --testsuite live
      - run: vendor/bin/phpmd src/ text phpmd.xml.dist
      - run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php -v --dry-run --using-cache=no
